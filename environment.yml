# Conda environment for stentFIT development.
#
# 1. Create the environment:  conda env create -f environment.yml
# 2. Activate it:             conda activate env_stentfit
# 3. Install stentFIT + deps: poetry install
#
# This file sets up Python + pip, plus git (a system tool pip cannot install,
# required by BeamMe to write commit metadata into 4C input file headers).
# All package dependencies live in pyproject.toml / poetry.lock and are
# installed with `poetry install` (the single source of truth). To change
# Python versions, edit the one `python=` line and recreate/update the
# environment.
name: env_stentfit
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.13
  - pip
  - git
