[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "stentfit"
version = "0.1.2"
description = "Semi-automated Pipeline for Virtual Stent Implantation with Mixed-Dimensional Modelling"
authors = ["Vural Aktas <vural.aktas@rwth-aachen.de>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/VuralAktas/stentFIT"
repository = "https://github.com/VuralAktas/stentFIT"
documentation = "https://stentfit.readthedocs.io"
keywords = ["stent", "biomechanics", "finite-element", "beam-to-solid",
            "mesh-generation", "cardiovascular", "4C", "simulation",
            "mixed-dimensional", "semi-automated", "pipeline", "stent-implantation", 
            "virtual-stent-implantation", "skeletonization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Operating System :: OS Independent",
]




[tool.poetry.dependencies]
python = ">=3.13,<3.14" # capped to match BeamMe's supported Python range
numpy = ">=2.5.1"
scipy = ">=1.18.0"
pandas = ">=3.0.3"
matplotlib = ">=3.11.0"
plotly = ">=6.8.0"
trimesh = ">=4.12.2"
scikit-image = ">=0.26.0"
scikit-learn = ">=1.9.0"
beamme = ">=0.2.0,<0.3.0" # 0.3.0 renamed/changed Mesh.write_vtk -> write_vtu (single-file, no beam/solid split); pin until ported
gmsh = ">=4.15.0"    # artery solid meshing (Mac-native; replaced Cubit/CubitPy)
# fourcipp parses & writes 4C input files (needed to import the GMSH solid mesh
# and dump the assembled .4C.yaml). Imported unconditionally by stent_splines.py
# (via beamme.four_c), so it must be a core dependency, not an optional group
# (Poetry's [dependency-groups] aren't installed by plain `pip install`).
fourcipp = ">=1.132.0"


[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)",
    "ipython (>=9.15.0,<10.0.0)",
    "jupyter (>=1.1.1,<2.0.0)"
]
docs = [
    "myst-nb (>=1.4.0,<2.0.0)",
    "sphinx-autoapi (>=3.8.0,<4.0.0)",
    "sphinx-rtd-theme (>=3.1.0,<4.0.0)",
    "sphinxcontrib-mermaid (>=2.1.0,<3.0.0)"
]
