[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stentFIT"
version = "0.1.0"
description = "Semi-automated virtual stent implantation via contact simulation (BeamMe / 4C)."
readme = "CLAUDE.md"
license = { text = "MIT" }
authors = [{ name = "Vural Aktas", email = "vuralaktas6741@gmail.com" }]
requires-python = ">=3.10"

# Runtime dependencies — THE single source of truth for what stentFIT needs.
# Add a new line here whenever you `import` a new third-party package.
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "plotly",
    "trimesh",
    "scikit-image",
    "scikit-learn",
    "networkx",
    "h5py",
    "joblib",
    "beamme",
    # "requests",
    # "psimpy",
    # "coscine",
]

[project.optional-dependencies]
# Notebook / development-only tools. Install with: pip install -e ".[dev]"
dev = [
    "ipykernel",
    "ipython",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["src"]
